<app-header />

<main>
    <ul id="users">
        <!-- //with track we are telling angular which 
        //unique identification criteria can be assign 
        //by angular to every list item -->
        @for (user of users; track user.id) {
        <li>
            <app-user 
            [selected]="user.id === selectedUserId"
            [user]="user"
            (select)="onSelectUser($event)"
             />
        </li>
        }
    </ul>

    @if (selectedUser) {
        <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name" />
    } @else {
        <p id="fallback">Select a user to view their tasks.</p>
    }
</main>
